name: Build Wadrop

# Runs automatically on every push (and can be started by hand from the
# Actions tab). No external dashboard or signing setup is required:
# - Android builds a release APK using the default debug signing.
# - iOS compiles without code signing, just to prove the app builds.
on:
  push:
    branches:
      - claude/bghit-had-les-fichier-8m1i7j
      - main
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wadrop-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (no signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
